<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>

        body{
            background-image: linear-gradient(to bottom, red, rgb(255, 94, 0), rgb(243, 219, 0));
            background-attachment: fixed;
        }
        #op{
            border: 3px solid blue;
            display: grid;
            grid-template: repeat(3, auto) / 1fr 50% 3fr;
            gap: 5px;
            padding: 5px;
        }
        .itens{
            border: 2px solid black;
            background-color: darkblue;
            color: white;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
            padding: 10px;
        }
    </style>
</head>
<body>
    
      <div id="op">
        <div class="itens">A</div>
        <div class="itens">B</div>
        <div class="itens">C</div>
        <div class="itens">D</div>
        <div class="itens">E</div>
        <div class="itens">F</div>
        <div class="itens">G</div>
        <div class="itens">H</div>
      </div>

</body>
</html>
